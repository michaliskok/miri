name: GenMC macOS debug

# Temporary workflow to debug GenMC failures on macOS; not meant to be merged.
on:
  push:
    branches:
      - genmc-macos-debug
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  genmc-macos:
    runs-on: macos-15
    env:
      HOST_TARGET: aarch64-apple-darwin
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/setup
        with:
          toolchain_flags: "--host aarch64-apple-darwin"

      - name: toolchain information
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          clang --version
          xcrun --show-sdk-version
          cmake --version | head -1

      - name: build Miri
        run: ./miri build --features=expensive-consistency-checks,genmc

      # Builds the sysroot and the test dependencies, so the steps below only measure the tests.
      - name: warm up
        run: ./miri test --features=expensive-consistency-checks,genmc tests/genmc/pass/std/empty_main.rs

      # Single tests, run directly so that their output is not buffered by ui_test.
      - name: "direct: litmus/2cowr (failed on CI)"
        continue-on-error: true
        timeout-minutes: 15
        run: ci/genmc-macos-debug.sh direct tests/genmc/pass/litmus/2cowr.rs
      - name: "direct: atomics/atomic_ptr_roundtrip (failed on CI)"
        continue-on-error: true
        timeout-minutes: 15
        run: ci/genmc-macos-debug.sh direct tests/genmc/pass/atomics/atomic_ptr_roundtrip.rs
      - name: "direct: atomics/cas_simple (single-threaded control, passed on CI)"
        continue-on-error: true
        timeout-minutes: 15
        run: ci/genmc-macos-debug.sh direct tests/genmc/pass/atomics/cas_simple.rs
      - name: "direct: std/spawn_std_threads"
        continue-on-error: true
        timeout-minutes: 15
        run: ci/genmc-macos-debug.sh direct tests/genmc/pass/std/spawn_std_threads.rs

      # The whole GenMC suite, as CI runs it. A hung test gets its stack sampled and is killed
      # after 25 minutes, so ui_test still prints all failure details at the end.
      - name: "suite: tests/genmc without GC stress"
        continue-on-error: true
        timeout-minutes: 40
        run: ci/genmc-macos-debug.sh suite tests/genmc
      - name: "suite: tests/genmc with GC stress (like CI)"
        continue-on-error: true
        timeout-minutes: 40
        env:
          MIRIFLAGS: -Zmiri-provenance-gc=1
        run: ci/genmc-macos-debug.sh suite tests/genmc
