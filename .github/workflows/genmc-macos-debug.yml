name: GenMC macOS debug

# Temporary workflow to debug GenMC failures on macOS; not meant to be merged.
on:
  push:
    branches:
      - genmc-macos-debug
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  genmc-macos:
    name: genmc-macos (${{ matrix.variant }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # See `configure` in ci/genmc-macos-debug.sh for what each variant changes.
        variant: [homebrew-llvm, apple-O0, apple-asan, apple-no-jemalloc]
    env:
      HOST_TARGET: aarch64-apple-darwin
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/setup
        with:
          toolchain_flags: "--host aarch64-apple-darwin"

      - name: configure variant
        run: ci/genmc-macos-debug.sh configure ${{ matrix.variant }}

      - name: toolchain information
        run: |
          sw_vers
          xcodebuild -version
          "${CXX:-clang++}" --version
          git diff --stat

      - name: build Miri
        run: ./miri build --features=expensive-consistency-checks,genmc

      - name: build information
        run: ci/genmc-macos-debug.sh build-info

      # Builds the sysroot and the test dependencies, so the steps below only measure the tests.
      - name: warm up
        continue-on-error: true
        run: ./miri test --features=expensive-consistency-checks,genmc tests/genmc/pass/std/empty_main.rs

      - name: "direct: litmus/2cowr (assertion failure with Apple clang)"
        id: assertion
        continue-on-error: true
        timeout-minutes: 15
        run: ci/genmc-macos-debug.sh direct tests/genmc/pass/litmus/2cowr.rs
      - name: "direct: std/spawn_std_threads (hang with Apple clang)"
        id: hang
        continue-on-error: true
        timeout-minutes: 15
        run: ci/genmc-macos-debug.sh direct tests/genmc/pass/std/spawn_std_threads.rs

      # Only worth running if the variant fixes both problems.
      - name: "suite: tests/genmc"
        if: steps.assertion.outcome == 'success' && steps.hang.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        run: ci/genmc-macos-debug.sh suite tests/genmc
